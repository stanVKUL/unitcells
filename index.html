<!doctype html>
<html lang="nl">
<head>
<title>Unit Cells VR</title>
<meta name="description" content="Bekijk lattice unit cells voor additive manufacturing van alle kanten, in VR op de Meta Quest.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
/* Eén scherm: 3D-beeld over de volle breedte, paneel links boven, VR-knop rechts onder. */
:root {
  color-scheme: dark;
  --bg: #101318;
  --surface: #1e232b;
  --line: #343c48;
  --text: #e8ecf1;
  --muted: #8b95a3;
  --accent: #ff7a1a;
  --accent-ink: #1a1206;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#dock {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px));
  width: clamp(360px, 40vw, 640px);
}
#dock canvas { display: block; width: 100%; height: auto; border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.45); }
.hint {
  position: fixed;
  top: calc(16px + env(safe-area-inset-top, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
  margin: 0; max-width: 34ch;
  font-size: 13px; line-height: 1.55; color: var(--muted); text-align: right;
}
.hint kbd {
  font-family: inherit; font-size: 12px; color: var(--text);
  border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--surface);
}
.bar {
  position: fixed;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  max-width: min(360px, calc(100% - 32px));
}
#vr {
  font: 700 17px/1 var(--font); letter-spacing: .01em;
  color: var(--accent-ink); background: var(--accent);
  border: 0; border-radius: 12px; padding: 16px 26px; cursor: pointer;
}
#vr:disabled { background: var(--surface); color: var(--muted); cursor: default; border: 1px solid var(--line); }
#vr:focus-visible { outline: 3px solid var(--text); outline-offset: 3px; }
#vrnote { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); text-align: right; }
@media (max-width: 700px) {
  #dock { width: calc(100% - 32px); }
  .hint { display: none; }
}
</style>
</head>
<body>
<div id="view" aria-label="3D-weergave van het rooster"></div>
<div id="dock"></div>
<p class="hint">
  Slepen = draaien · scrollen = zoomen<br>
  <kbd>←</kbd> <kbd>→</kbd> andere cel · <kbd>↑</kbd> <kbd>↓</kbd> aantal cellen<br>
  <kbd>H</kbd> uitlichten · <kbd>G</kbd> celgrenzen<br>
  <kbd>O</kbd> overhang · <kbd>D</kbd> doorsnede · <kbd>R</kbd> reset
</p>
<div class="bar">
  <button id="vr" type="button" disabled>VR controleren…</button>
  <p id="vrnote"></p>
</div>
